version: 2

models:
  - name: dim_products
    description: "Справочник товаров. Одна строка на товар."
    columns:
    - name: product_id
      description: "Уникальный идентификатор товара."
      data_tests: [unique, not_null]
    - name: product_name
      description: "Название товара."
    - name: brand
      description: "Бренд товара."
    - name: category_name
      description: "Категория товара."
    - name: parent_category_name
      description: "Категория на уровень выше."
    - name: root_category_name
      description: "Самая верхняя категория товара."


  - name: dim_customers
    description: "Справочник клиентов. Одна строка на клиента."
    columns:
      - name: customer_id
        description: "Уникальный идентификатор клиента."
        data_tests: [unique, not_null]
      - name: registered_at
        description: "Дата и время регистрации клиента."
      - name: city
        description: "Город клиента."
      - name: acquisition_channel
        description: "Канал, через который пришел клиент."
      - name: first_confirmed_order_id
        description: "Номер первого подтвержденного заказа."
      - name: first_confirmed_at
        description: "Дата и время первого подтвержденного заказа."
      - name: confirmed_orders_count
        description: "Количество подтвержденных заказов клиента."
      - name: confirmed_revenue
        description: "Сумма подтвержденных заказов клиента в рублях."
      - name: is_buyer
        description: "Есть ли у клиента хотя бы 1 подтвержденный заказ."


  - name: dim_dates
    description: "Календарь. Одна строка на день."
    columns:
      - name: order_date
        description: "Календарная дата."
        data_tests: [unique, not_null]
      - name: year
        description: "Год."
      - name: quarter
        description: "Номер квартала."
      - name: month
        description: "Номер месяца."
      - name: day_of_week
        description: "Номер дня недели."
      - name: is_weekend
        description: "Приходится ли дата на сб или вс."

  - name: fct_order_items
    description: "Позиции заказов. Одна строка на товар в заказе."
    columns:
      - name: quantity
        description: "Количество единиц товара в позиции."
        data_tests: [non_negative]

      - name: unit_price
        description: "Цена одной единицы товара в рублях."
        data_tests: [non_negative]

      - name: order_item_id
        description: "Идентификатор позиции, сформированный из номера заказа и идентификатора товара."
        data_tests: [unique, not_null]

      - name: product_id
        description: "Товар в позиции заказа."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        description: "Дата оформления заказа."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: order_date

      - name: order_id
        description: "Номер заказа, в который входит позиция."
      - name: discount_amount
        description: "Скидка на позицию в рублях."
      - name: line_amount
        description: "Сумма по позиции после скидки в рублях."
      - name: is_confirmed
        description: "{{ doc('confirmed_order') }}"

  - name: fct_orders
    description: >
      Факт заказов: одна строка — один заказ. Тестовые заказы исключены.
      К заказу пристыкованы итоги по платежам; подтвержденная покупка — статус paid
      и хотя бы одна успешная оплата (возврат оплатой не считается).
    columns:
      - name: items_count
        description: "Число разных товаров в заказе."
      - name: order_id
        description: "Номер заказа."
        data_tests: [unique, not_null]

      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        description: "Дата заказа."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: order_date

      - name: ordered_at
        description: "Время оформления заказа."
      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled."
      - name: order_amount
        description: "Сумма заказа в рублях после скидок."
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
      - name: refunded_amount
        description: "Сумма возвратов положительным числом; 0, если возвратов нет."
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
      - name: first_paid_at
        description: "Время первой успешной оплаты; пусто, если оплат нет."
      - name: is_confirmed
        description: "{{ doc('confirmed_order') }}"
        data_tests: [not_null]
